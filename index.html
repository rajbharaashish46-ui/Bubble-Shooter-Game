<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ashu Bubble Adventure</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <div class="logo-area">
                <div class="logo-bubbles-bg">
                    <div class="logo-bg-circle c1"></div>
                    <div class="logo-bg-circle c2"></div>
                    <div class="logo-bg-circle c3"></div>
                    <div class="logo-bg-circle c4"></div>
                    <div class="logo-bg-circle c5"></div>
                    <div class="logo-bg-circle c6"></div>
                </div>
                <h1 class="logo-game-title">BUBBLES</h1>
            </div>
            <div class="menu-btns-main">
                <button id="start-game-btn" class="play-btn-large">
                    <span>PLAY</span>
                    <div class="play-arrow"></div>
                </button>
            </div>
            <button id="settings-btn" class="settings-btn-bottom">
                <div class="settings-gear">⚙</div>
            </button>
        </div>

        <!-- Level Selection Screen -->
        <div id="map-screen" class="screen hidden">
            <div class="level-select-container">
                <div class="level-select-header">
                    <div class="level-select-title-banner">
                        <span>Level Select</span>
                    </div>
                    <button id="map-back-btn" class="close-x-btn-round">×</button>
                </div>
                <div class="level-grid-container">
                    <div id="level-grid" class="level-grid">
                        <!-- Levels will be injected here by JS -->
                    </div>
                </div>
                <div class="level-pagination-dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            <!-- Top HUD -->
            <div class="game-top-hud-minimal">
                <div class="hud-stat">
                    <span class="hud-stat-label">SCORE</span>
                    <span id="score-val" class="hud-stat-value">0</span>
                </div>
                <div class="hud-stat">
                    <span class="hud-stat-label">LEVEL</span>
                    <span id="level-val" class="hud-stat-value">1</span>
                </div>
            </div>
            <canvas id="gameCanvas"></canvas>

            <!-- Bottom Gameplay Controls -->
            <div id="game-footer">
                <div class="footer-left">
                    <button id="exchange-btn" class="icon-btn-footer exchange">
                        <div class="exchange-ball-mini" id="footer-next-ball"></div>
                        <div class="exchange-arrows">🔄</div>
                    </button>
                    <div class="chest-box">
                        <!-- Decorative chest as seen in ref -->
                    </div>
                </div>

                <div class="footer-right">
                    <button id="in-game-pause-btn" class="icon-btn-footer pause">
                        <span>||</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Settings/Pause Overlay -->
        <div id="pause-overlay" class="overlay hidden">
            <div class="popup settings-popup">
                <button id="close-x" class="close-x-btn">×</button>
                <h2 class="popup-title">Settings</h2>
                <div class="settings-options">
                    <button id="how-to-play-btn" class="settings-row-btn">
                        <span>How to play</span>
                    </button>
                    <button id="popup-music-btn" class="settings-row-btn sound-toggle">
                        <div class="icon-circle">🔊</div>
                        <span>Sound on</span>
                    </button>
                    <button id="language-btn" class="settings-row-btn lang-select">
                        <div class="icon-circle flag">🇬🇧</div>
                        <span>English (GB)</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Win Overlay -->
        <div id="win-overlay" class="overlay hidden">
            <div class="popup win-popup-new">
                <div class="win-banner">
                    <div class="star-container-win">
                        <div class="star-win-wrapper s1" id="star1-win">★</div>
                        <div class="star-win-wrapper s2" id="star2-win">★</div>
                        <div class="star-win-wrapper s3" id="star3-win">★</div>
                    </div>
                    <div class="win-text-banner">
                        <span>LEVEL COMPLETE!</span>
                    </div>
                </div>
                <div class="win-score-box">
                    <span class="score-label">SCORE</span>
                    <span id="win-score-val" class="score-value">0</span>
                </div>
                <div class="win-buttons">
                    <button id="win-map-btn" class="icon-btn-footer win-home">🏠</button>
                    <button id="win-next-btn" class="play-btn-large win-next">
                        <span>NEXT</span>
                    </button>
                    <button id="win-retry-btn" class="icon-btn-footer win-retry">🔄</button>
                </div>
            </div>
        </div>

        <div id="lose-overlay" class="overlay hidden">
            <div class="popup lose-popup">
                <div class="lose-icon">☹</div>
                <h2>GAME OVER</h2>
                <div class="popup-btn-row">
                    <button id="retry-btn" class="popup-btn">RETRY</button>
                    <button id="lose-home-btn" class="popup-btn">HOME</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification system for "Complete previous level" -->
    <div id="toast" class="hidden">Complete previous level</div>

    <script src="script.js"></script>
</body>

</html>
